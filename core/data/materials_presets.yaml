# Aerotelic material presets (Model > Material Properties). SI: kg/m^3, Pa.
#
# Every material here comes from a source that may be redistributed
# publicly and commercially, so this file ships with the application:
# CMake embeds it into the core library at build time (edit it, rebuild).
#
#   Metals -- MIL-HDBK-5J, Metallic Materials and Elements for Aerospace
#     Vehicle Structures, US Department of Defense, 31 January 2003
#     (Distribution Statement A; a US Government work, public domain).
#     Each row names its handbook table, specification, product form,
#     condition, thickness range and basis, and the two strengths in ksi.
#     The allowable is the handbook's design MINIMUM tensile yield Fty
#     (A-basis -- 99% of material exceeds it at 95% confidence -- where
#     the handbook gives one, else S-basis, the specification minimum),
#     longitudinal: a design value, 5-15% below a typical yield. Casting
#     rows are "any area" minimums. 1 ksi = 6.894757 MPa, 1 lb/in^3 =
#     27679.9 kg/m^3. Where the handbook leaves Poisson's ratio blank a
#     literature value is used and the source says so.
#   Composites -- representative quasi-isotropic laminates, no one's data.
#   Woods -- USDA Forest Products Laboratory, Wood Handbook FPL-GTR-190
#     (2010), Tables 5-1, 5-3 and 5-5 at 12% moisture (public domain);
#     ANC-18 (1951) for the plywood rule; Borrega & Gibson 2015 for the
#     balsa grades' density scaling (a method, not their data). The
#     allowable is the compression strength parallel to the grain.
#
# Materials from sources whose terms restrict redistribution -- the ASM
# Handbooks, manufacturers' data sheets -- are NOT in this file: see
# materials_restricted.yaml, which is not embedded, and the library file
# of a user who holds them.
#
# A material's name is written into a project file when it is assigned,
# so renaming a row orphans old files: add rows, do not rename them.
# Fields: name, category (Metal, Composite, Wood, Foam, SLA resin, FDM
# thermoplastic, ...), density kg/m^3, youngs_modulus Pa, poisson_ratio,
# allowable_stress Pa (0 = no margin reported), source (free text).
