# Aerotelic materials from sources whose terms restrict redistribution.
# SI: kg/m^3, Pa. NOT part of the public distribution: this file is not
# embedded into the application and is not staged into a package. It is
# the set that was split out of the presets on 2026-11-07 and written into
# the user's own library file (materials.yaml beside the licence file),
# where Model > Material Properties reads it like any material of theirs.
#
#   The first seven metals -- typical room-temperature values from the ASM
#     Handbook vol. 1 and 2 (ASM International requires written consent to
#     reproduce its material) and, for 17-4PH, AK Steel's product bulletin;
#     the allowable is the typical tensile yield. Public-domain MIL-HDBK-5J
#     rows for the same alloys are in materials_presets.yaml.
#   Foam -- Evonik ROHACELL IG-F data sheet.
#   SLA / LCD / DLP resins -- Formlabs, Siraya Tech and Anycubic technical
#     data sheets, post-cured figures (Anycubic's ranges at their
#     conservative bounds); Poisson's ratios are literature values.
#   FDM thermoplastics -- Prusament, Bambu Lab, Polymaker, Markforged,
#     Stratasys and 3DXTech technical data sheets, as printed, flat
#     orientation; a printed part is weaker across its layers.
#
# Individual property values are facts, not copyrightable in the US
# (Feist v. Rural; 17 USC 103(b)); the restriction is the publishers'
# terms of use, which mostly permit personal or non-commercial use only.
