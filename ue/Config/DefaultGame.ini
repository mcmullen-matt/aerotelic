[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Aerotelic
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "Aerotelic")
Description=Parametric aircraft-geometry CAD (standalone)
; Frameless main window, as WingDesigner's (Qt.FramelessWindowHint): the
; shell draws its own title bar (MainShell/AerotelicTitleBar) with the
; window buttons; Slate keeps the edge-resize zones.
bUseBorderlessWindow=True

[/Script/UnrealEd.ProjectPackagingSettings]
; For a future packaged (cooked) build: the engine content the runtime loads
; by path, and the empty engine map the app starts in.
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
; Read at runtime as plain files: the welcome screen's artwork and VERSION
; (Resources/), the tutorial projects (Projects/).
+DirectoriesToAlwaysStageAsNonUFS=(Path="Resources")
+DirectoriesToAlwaysStageAsNonUFS=(Path="Projects")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineMaterials")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineDebugMaterials")
+MapsToCook=(FilePath="/Engine/Maps/Entry")
