; Aerotelic standalone application (see AerotelicUE.Target.cs).

[/Script/EngineSettings.GameMapsSettings]
; The engine's own empty map: the scene (lighting, camera, entities) is all
; built at runtime by AerotelicGameMode, so no project map asset exists.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/AerotelicUE.AerotelicGameMode

[/Script/Engine.Engine]
; Models are a few units across (1 model unit = 1 Unreal unit); the stock
; 10-unit near plane would clip them as soon as the camera orbits in close.
NearClipPlane=0.5

[/Script/Engine.RendererSettings]
; A CAD view wants a steady, unprocessed image: no eye adaptation pumping
; as the camera moves, no motion blur/bloom/flare, cheap AA, no Lumen.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.AntiAliasingMethod=1
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=False

[/Script/Engine.UserInterfaceSettings]
; Keep the Slate shell at 1:1 regardless of window size (the engine default
; curve shrinks UI below 1080p).
UIScaleRule=ShortestSide
UIScaleCurve=(EditorCurveData=(Keys=((Time=480.000000,Value=1.000000),(Time=4320.000000,Value=1.000000))),ExternalCurve=None)

[SystemSettings]
t.MaxFPS=60

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=195050C047F5A12938864D9C5052EB0B
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=
